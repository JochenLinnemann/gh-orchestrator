name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repo hygiene
        run: |
          test -f README.md
          test -f ARCHITECTURE.md
          test -f DECISIONS.md

  dotnet:
    runs-on: ubuntu-latest
    needs: sanity
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v1
        with:
          versionSpec: '6.x'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v1

      - name: Restore
        run: dotnet restore GhOrchestrator.sln

      - name: Build
        run: dotnet build GhOrchestrator.sln --configuration Release --no-restore /p:Version=${{ steps.gitversion.outputs.semVer }}

      - name: Test
        run: dotnet test GhOrchestrator.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: "**/*.trx"
